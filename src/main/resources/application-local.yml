spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/seoulgo
    username: seoulgo
    password: 1106
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET:seoulgo-local-development-secret-key-32-bytes-minimum}
  access-expire-ms: 3600000
  refresh-expire-ms: 1209600000